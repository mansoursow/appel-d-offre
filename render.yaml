# ===========================================================================
# Deploiement sur Render (https://render.com) -- voir DEPLOIEMENT.md
# ===========================================================================
# Le plan "starter" est necessaire : c'est le premier qui autorise un DISQUE
# PERSISTANT. Sans disque, Render repart d'un systeme de fichiers vide a chaque
# redeploiement, ce qui effacerait les comptes, l'historique de connexions et
# les offres deposees.
services:
  - type: web
    name: veille-appels-offres
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health
    autoDeploy: true

    disk:
      name: donnees
      mountPath: /var/data
      sizeGB: 5

    envVars:
      # Genere une seule fois par Render, puis conservee : les sessions
      # survivent aux redemarrages et la valeur n'apparait pas dans Git.
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/tenders.db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SECRET_KEY_FILE
        value: /var/data/.secret_key
      # Duree d'une session : 12 heures.
      - key: TOKEN_TTL_SECONDS
        value: "43200"
